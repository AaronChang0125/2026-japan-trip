<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1a2332">
<title>採買清單 ・ 北陸 + 東京 12 日</title>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div class="site-title">
      <h1>採買清單</h1>
      <span class="dates">名物 + 伴手禮</span>
    </div>
    <nav class="page-tabs">
      <a href="index.html">行程</a>
      <a href="packing.html">打包清單</a>
      <a href="shopping.html" class="active">採買清單</a>
    </nav>
  </div>
</header>

<main id="top">

  <section class="hero">
    <h2>🛍 採買清單</h2>
    <p class="sub">雲端即時同步 ・ 多裝置共用 <span id="sync-status" class="sync-status">連線中…</span></p>
  </section>

  <div id="shop-sections"></div>
  <p id="shop-empty" class="shop-empty">還沒有分類，點下方「＋ 新增分類」開始建立</p>

  <div class="shop-section-add">
    <button id="add-section-btn" type="button">＋ 新增分類</button>
  </div>

  <footer>
    採買清單 ・ 12 日北陸 + 東京 ・ 2026.05.20–05.31
  </footer>

</main>

<button class="theme-toggle" id="theme-toggle" aria-label="切換明暗主題" type="button">🌙</button>
<a href="#top" class="to-top" aria-label="回到最上">↑</a>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBiosBfZhyq1EBvFJT4vGu5dGDLkH3qsYo",
    authDomain: "japan-trip-e546d.firebaseapp.com",
    projectId: "japan-trip-e546d",
    storageBucket: "japan-trip-e546d.firebasestorage.app",
    messagingSenderId: "294987809115",
    appId: "1:294987809115:web:c51ffe435e2e9b9c5a1a7e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = doc(db, 'lists', 'shared');

  const STORAGE_KEY = 'shopping-list-v3';
  // sections: [{ id, name, items: [{ id, text, done }] }]
  let sections = [];
  let firstSnapshot = true;

  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { sections = JSON.parse(stored); } catch(e) { sections = []; }
  }

  const sectionsEl = document.getElementById('shop-sections');
  const emptyEl = document.getElementById('shop-empty');
  const addSectionBtn = document.getElementById('add-section-btn');
  const syncEl = document.getElementById('sync-status');

  function setSyncStatus(state) {
    if (!syncEl) return;
    if (state === 'synced') {
      syncEl.textContent = '✓ 已同步';
      syncEl.className = 'sync-status synced';
    } else if (state === 'connecting') {
      syncEl.textContent = '連線中…';
      syncEl.className = 'sync-status';
    } else if (state === 'offline') {
      syncEl.textContent = '⚠ 離線(本機)';
      syncEl.className = 'sync-status offline';
    }
  }

  function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sections));
  }

  async function saveRemote() {
    try {
      await setDoc(docRef, { sections, updatedAt: serverTimestamp() });
    } catch (e) {
      console.warn('Firestore save failed:', e);
      setSyncStatus('offline');
    }
  }

  function save() {
    saveLocal();
    saveRemote();
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function render() {
    sectionsEl.innerHTML = '';
    sections.forEach(section => {
      const total = section.items.length;
      const done = section.items.filter(i => i.done).length;

      const card = document.createElement('div');
      card.className = 'checklist shop-section';
      card.dataset.sectionId = section.id;
      card.innerHTML = `
        <div class="shop-section-header">
          <h3 class="shop-section-name">${escapeHtml(section.name)} <span class="count">${total > 0 ? done + '/' + total : ''}</span></h3>
          <button type="button" class="section-rename" data-section-id="${section.id}" aria-label="改名" title="改名">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/></svg>
          </button>
          <button type="button" class="section-delete" data-section-id="${section.id}" aria-label="刪除分類" title="刪除分類">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/></svg>
          </button>
        </div>
        <div class="section-items">
          ${section.items.map(item => `
            <label class="shop-item">
              <input type="checkbox" ${item.done ? 'checked' : ''} data-section-id="${section.id}" data-item-id="${item.id}">
              <span class="l-text">${escapeHtml(item.text)}</span>
              <button type="button" class="shop-del" data-section-id="${section.id}" data-item-id="${item.id}" aria-label="刪除">✕</button>
            </label>
          `).join('')}
        </div>
        <div class="section-add-row">
          <input type="text" class="section-add-input" placeholder="新項目，按 Enter 加入" data-section-id="${section.id}" autocomplete="off">
        </div>
      `;
      sectionsEl.appendChild(card);
    });
    emptyEl.style.display = sections.length === 0 ? 'block' : 'none';
  }

  function addSection() {
    const name = prompt('輸入分類名稱（如：北陸名產、高山伴手禮）');
    if (!name || !name.trim()) return;
    sections.push({ id: uid(), name: name.trim(), items: [] });
    save();
    render();
  }

  function renameSection(sectionId) {
    const section = sections.find(s => s.id === sectionId);
    if (!section) return;
    const name = prompt('改分類名稱', section.name);
    if (!name || !name.trim()) return;
    section.name = name.trim();
    save();
    render();
  }

  function deleteSection(sectionId) {
    const section = sections.find(s => s.id === sectionId);
    if (!section) return;
    const msg = section.items.length > 0
      ? `「${section.name}」內有 ${section.items.length} 個項目，確定刪除整個分類？`
      : `確定刪除分類「${section.name}」？`;
    if (!confirm(msg)) return;
    sections = sections.filter(s => s.id !== sectionId);
    save();
    render();
  }

  function addItem(sectionId, text) {
    const section = sections.find(s => s.id === sectionId);
    if (!section) return;
    if (!text || !text.trim()) return;
    section.items.push({ id: uid(), text: text.trim(), done: false });
    save();
    render();
  }

  function toggleItem(sectionId, itemId, checked) {
    const section = sections.find(s => s.id === sectionId);
    if (!section) return;
    const item = section.items.find(i => i.id === itemId);
    if (!item) return;
    item.done = checked;
    save();
    // Re-render only the count for performance
    const card = sectionsEl.querySelector(`[data-section-id="${sectionId}"]`);
    if (card) {
      const total = section.items.length;
      const done = section.items.filter(i => i.done).length;
      card.querySelector('.count').textContent = total > 0 ? done + '/' + total : '';
    }
  }

  function deleteItem(sectionId, itemId) {
    const section = sections.find(s => s.id === sectionId);
    if (!section) return;
    section.items = section.items.filter(i => i.id !== itemId);
    save();
    render();
  }

  // Event delegation
  addSectionBtn.addEventListener('click', addSection);

  sectionsEl.addEventListener('click', e => {
    const renameBtn = e.target.closest('.section-rename');
    const deleteBtn = e.target.closest('.section-delete');
    const delItemBtn = e.target.closest('.shop-del');
    if (renameBtn) {
      renameSection(renameBtn.dataset.sectionId);
    } else if (deleteBtn) {
      deleteSection(deleteBtn.dataset.sectionId);
    } else if (delItemBtn) {
      deleteItem(delItemBtn.dataset.sectionId, delItemBtn.dataset.itemId);
    }
  });

  sectionsEl.addEventListener('change', e => {
    if (e.target.matches('input[type="checkbox"]')) {
      toggleItem(e.target.dataset.sectionId, e.target.dataset.itemId, e.target.checked);
    }
  });

  sectionsEl.addEventListener('keydown', e => {
    if (e.target.classList.contains('section-add-input') && e.key === 'Enter') {
      e.preventDefault();
      const sectionId = e.target.dataset.sectionId;
      const text = e.target.value;
      if (text.trim()) {
        addItem(sectionId, text);
      }
    }
  });

  render();
  setSyncStatus('connecting');

  // Subscribe to Firestore real-time updates
  onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      if (data.sections && Array.isArray(data.sections)) {
        sections = data.sections;
        saveLocal();
        render();
      } else if (data.items && Array.isArray(data.items) && sections.length === 0) {
        // Migrate from old flat items array → put into 「未分類」section
        sections = [{ id: uid(), name: '未分類', items: data.items }];
        save();
        render();
      }
    } else if (firstSnapshot && sections.length > 0) {
      saveRemote();
    }
    firstSnapshot = false;
    setSyncStatus('synced');
  }, (error) => {
    console.warn('Firestore subscription error:', error);
    setSyncStatus('offline');
  });

  // Theme toggle
  const themeToggle = document.getElementById('theme-toggle');
  function updateThemeIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeToggle.textContent = isDark ? '☀' : '🌙';
  }
  updateThemeIcon();
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
    updateThemeIcon();
  });

  // Back to top
  const toTop = document.querySelector('.to-top');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) toTop.classList.add('show');
    else toTop.classList.remove('show');
  }, { passive: true });
</script>

</body>
</html>
