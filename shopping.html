<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1a2332">
<title>採買清單 ・ 北陸 + 東京 12 日</title>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <div class="site-title">
      <h1>採買清單</h1>
      <span class="dates">名物 + 伴手禮</span>
    </div>
    <nav class="page-tabs">
      <a href="index.html">行程</a>
      <a href="packing.html">打包清單</a>
      <a href="shopping.html" class="active">採買清單</a>
    </nav>
  </div>
</header>

<main id="top">

  <section class="hero">
    <h2>🛍 採買清單</h2>
    <p class="sub">雲端即時同步 ・ 多裝置共用 <span id="sync-status" class="sync-status">連線中…</span></p>
  </section>

  <div class="shop-add">
    <input type="text" id="shop-input" placeholder="輸入新項目，按 Enter 或新增" autocomplete="off">
    <button id="shop-add-btn" type="button">＋ 新增</button>
  </div>

  <div class="checklist" data-key="shop-custom">
    <h3>🛒 我的採買清單 <span class="count"></span></h3>
    <div id="shop-items"></div>
    <p id="shop-empty" class="shop-empty">還沒有項目，從上面輸入框新增</p>
  </div>

  <footer>
    採買清單 ・ 12 日北陸 + 東京 ・ 2026.05.20–05.31
  </footer>

</main>

<button class="theme-toggle" id="theme-toggle" aria-label="切換明暗主題" type="button">🌙</button>
<a href="#top" class="to-top" aria-label="回到最上">↑</a>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBiosBfZhyq1EBvFJT4vGu5dGDLkH3qsYo",
    authDomain: "japan-trip-e546d.firebaseapp.com",
    projectId: "japan-trip-e546d",
    storageBucket: "japan-trip-e546d.firebasestorage.app",
    messagingSenderId: "294987809115",
    appId: "1:294987809115:web:c51ffe435e2e9b9c5a1a7e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = doc(db, 'lists', 'shared');

  const STORAGE_KEY = 'shopping-list-v2';
  // items: [{ id: string, text: string, done: boolean }]
  let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

  const input = document.getElementById('shop-input');
  const addBtn = document.getElementById('shop-add-btn');
  const itemsEl = document.getElementById('shop-items');
  const emptyEl = document.getElementById('shop-empty');
  const countEl = document.querySelector('.checklist .count');
  const syncEl = document.getElementById('sync-status');

  function setSyncStatus(state) {
    if (!syncEl) return;
    if (state === 'synced') {
      syncEl.textContent = '✓ 已同步';
      syncEl.className = 'sync-status synced';
    } else if (state === 'connecting') {
      syncEl.textContent = '連線中…';
      syncEl.className = 'sync-status';
    } else if (state === 'offline') {
      syncEl.textContent = '⚠ 離線(本機)';
      syncEl.className = 'sync-status offline';
    }
  }

  function saveLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  async function saveRemote() {
    try {
      await setDoc(docRef, { items, updatedAt: serverTimestamp() });
    } catch (e) {
      console.warn('Firestore save failed:', e);
      setSyncStatus('offline');
    }
  }

  function save() {
    saveLocal();
    saveRemote();
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function render() {
    itemsEl.innerHTML = '';
    items.forEach(item => {
      const label = document.createElement('label');
      label.className = 'shop-item';
      label.innerHTML = `
        <input type="checkbox" ${item.done ? 'checked' : ''} data-id="${item.id}">
        <span class="l-text">${escapeHtml(item.text)}</span>
        <button type="button" class="shop-del" data-id="${item.id}" aria-label="刪除">✕</button>
      `;
      itemsEl.appendChild(label);
    });
    emptyEl.style.display = items.length === 0 ? 'block' : 'none';
    updateCount();
  }

  function updateCount() {
    const total = items.length;
    const done = items.filter(i => i.done).length;
    countEl.textContent = total > 0 ? `${done}/${total}` : '';
  }

  function addItem() {
    const text = input.value.trim();
    if (!text) return;
    items.push({ id: uid(), text, done: false });
    save();
    render();
    input.value = '';
    input.focus();
  }

  addBtn.addEventListener('click', addItem);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });

  itemsEl.addEventListener('change', e => {
    if (e.target.type === 'checkbox') {
      const id = e.target.dataset.id;
      const item = items.find(i => i.id === id);
      if (item) {
        item.done = e.target.checked;
        save();
        updateCount();
      }
    }
  });

  itemsEl.addEventListener('click', e => {
    if (e.target.classList.contains('shop-del')) {
      const id = e.target.dataset.id;
      items = items.filter(i => i.id !== id);
      save();
      render();
    }
  });

  // Render local cache first for fast initial paint
  render();
  setSyncStatus('connecting');

  // Subscribe to Firestore real-time updates
  onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.data();
      if (data.items && Array.isArray(data.items)) {
        items = data.items;
        saveLocal();
        render();
      }
    } else {
      // Document doesn't exist yet — push local data to seed it
      saveRemote();
    }
    setSyncStatus('synced');
  }, (error) => {
    console.warn('Firestore subscription error:', error);
    setSyncStatus('offline');
  });

  // Theme toggle
  const themeToggle = document.getElementById('theme-toggle');
  function updateThemeIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeToggle.textContent = isDark ? '☀' : '🌙';
  }
  updateThemeIcon();
  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
    updateThemeIcon();
  });

  // Back to top
  const toTop = document.querySelector('.to-top');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) toTop.classList.add('show');
    else toTop.classList.remove('show');
  }, { passive: true });
</script>

</body>
</html>
